name: Build and push multi-arch image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # ensure tags are available
          tags: true

      - name: Get latest tag
        id: get_tag
        run: |
          # get the most recent tag reachable from any ref
          TAG=$(git describe --tags $(git rev-list --tags --max-count=1) 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            # fallback to first annotated tag or use commit SHA short
            TAG=$(git tag --sort=-v:refname | head -n1 || true)
          fi
          if [ -z "$TAG" ]; then
            TAG=$(git rev-parse --short HEAD)
          fi
          echo "Latest tag: $TAG"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch images
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-pad:${{ steps.get_tag.outputs.TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/my-pad:latest
